<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/minilogo.png" type="image/png">
  <title data-i18n="title.university">University | UniSearch</title>
  <script src="theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin,latin-ext" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/university.css" />
</head>

<body data-page="university">
  <main class="d-page">
    <div class="d-container">
      <div id="detailState" class="d-state"></div>
      <div id="detailLoading" class="d-loading-overlay" aria-hidden="true">
        <div class="d-loading-spinner" role="status" aria-label="Loading university details" data-i18n-aria-label="university.loading"></div>
      </div>

      <section id="detailCard" class="d-card" style="display:none;">
        
        <div class="d-cover" id="detailCover">
          <div class="d-cover-overlay"></div>
          <div class="d-cover-logo" id="detailLogo">U</div>
        </div>

        <div class="d-head">
          <div style="flex-grow: 1;"> <div style="display:flex; align-items:center; gap: 10px;">
                <h1 id="detailName" class="d-title">University Name</h1>
                <a id="detailWebsite" href="#" target="_blank" class="d-site-link" title="Visit Official Website" data-i18n-title="university.visit_website">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                </a>
                <a id="detailMapLink" href="#" class="d-site-link" title="Show on map" style="display:none;" data-i18n-title="university.show_on_map">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21s-7-4.35-7-11a7 7 0 1 1 14 0c0 6.65-7 11-7 11z"></path>
                        <circle cx="12" cy="10" r="2.5"></circle>
                    </svg>
                </a>
            </div>
            <div id="detailLocation" class="d-location">Location</div>
          </div>
          <a class="d-back" href="universities.html" data-i18n="university.back_to_list">Back to list</a>
        </div>

        <div class="d-tabs">
          <button class="d-tab-btn active" data-tab="tab-general">
            <span class="icon">📄</span> <span data-i18n="university.tab.general">General</span>
          </button>
          <button class="d-tab-btn" data-tab="tab-programs">
            <span class="icon">🎓</span> <span data-i18n="university.tab.programs">Programs</span>
          </button>
          <button class="d-tab-btn" data-tab="tab-admission">
            <span class="icon">📝</span> <span data-i18n="university.tab.admission">Admission</span>
          </button>
          <button class="d-tab-btn" data-tab="tab-finance">
            <span class="icon">💲</span> <span data-i18n="university.tab.costs">Costs</span>
          </button>
        </div>

        <div class="d-tab-content">
          
          <div id="tab-general" class="d-tab-pane active">
            <div class="d-box">
              <div class="d-box-title" data-i18n="university.about_campus">About & Campus</div>
              <div id="detailExtra" class="d-box-text"></div>
            </div>
            <div class="d-box" style="margin-top: 20px;">
               <div class="d-box-title" data-i18n="university.overview">Overview</div>
               <div id="detailRecommendations" class="d-box-text"></div>
            </div>
          </div>

          <div id="tab-programs" class="d-tab-pane">
            <div class="d-box">
              <div class="d-box-title" data-i18n="university.available_majors">Available Majors</div>
              <div id="detailPrograms" class="d-box-text"></div>
            </div>
          </div>

          <div id="tab-admission" class="d-tab-pane">
            <div class="d-box">
              <div class="d-box-title" data-i18n="university.entry_requirements">Entry Requirements</div>
              <div id="detailRequirements" class="d-box-text"></div>
            </div>
          </div>

          <div id="tab-finance" class="d-tab-pane">
             <div class="d-box finance-box">
              <div class="d-box-title" data-i18n="university.total_cost_calculator">Total Cost Calculator</div>
              
              <div class="finance-summary-container">
                  <div class="finance-summary-left">
                     <h3 style="margin:0 0 10px 0; font-size:16px;" data-i18n="university.discounts_scholarships">Discounts & Scholarships</h3>
                     <div id="detailScholarshipInfo" class="scholarship-card">
                        <div class="center-loading center-loading--compact" role="status" aria-label="Loading scholarships" data-i18n-aria-label="university.loading_scholarships">
                          <div class="center-loading-spinner center-loading-spinner--sm" aria-hidden="true"></div>
                        </div>
                     </div>
                  </div>
                  
                  <div class="finance-summary-right">
                     <div class="total-price-card">
                        <div class="price-header" data-i18n="university.total_estimated_cost">Total Estimated Cost</div>
                        <div class="price-big" id="detailPrice"></div>
                        <div class="price-sub" data-i18n="university.per_year">per year</div>
                     </div>
                  </div>
              </div>

              <div id="detailFinance" class="finance-list-full"></div>
              
            </div>
          </div>

        </div>
      </section>
    </div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="javascript/main.js"></script>

  <footer class="site-footer">
    <div class="container footer-content">
        <p data-i18n="footer.copyright">© 2026 UniSearch</p>
        
        <div class="social-links">
            <a href="https://github.com/muxlex/unisearch" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub" width="32">
            </a>
        </div>
    </div>
  </footer>
</body>
</html>
