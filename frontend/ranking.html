<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="./" />
  <link rel="icon" href="images/minilogo.png" type="image/png">
  <title data-i18n="title.ranking">Global Ranking | UniSearch</title>
  <script src="javascript/theme-init.js"></script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/universities.css" />
  <link rel="stylesheet" href="css/ranking.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin,latin-ext" rel="stylesheet">
</head>
<body data-page="ranking">
  <div id="siteInitialLoader" class="site-initial-loader">
    <div class="skeleton-bg skeleton-bg--row">
      <div class="skeleton-block skel-header-bar"></div>
      <div class="skel-sidebar-col">
        <div class="skeleton-block skel-title" style="width: 80%;"></div>
        <div class="skeleton-block skel-text"></div>
        <div class="skeleton-block skel-text"></div>
      </div>
      <div class="skel-content-col">
        <div class="skeleton-block skel-title" style="width: 40%;"></div>
        <div class="skeleton-block skel-text" style="height: 60px;"></div>
        <div class="skeleton-block skel-text" style="height: 60px;"></div>
        <div class="skeleton-block skel-text" style="height: 60px;"></div>
        <div class="skeleton-block skel-text" style="height: 60px;"></div>
        <div class="skeleton-block skel-text" style="height: 60px;"></div>
        <div class="skeleton-block skel-text" style="height: 60px;"></div>
      </div>
    </div>
    <div class="site-initial-loader__spinner"></div>
  </div>
  <main class="u-page">
    <div class="rank-container">
      <div class="rank-header">
        <h1><span class="rank-title-icon" data-heroicon="trophy" data-icon-size="24"></span> <span data-i18n="ranking.title">Global University Ranking</span></h1>
        <p data-i18n="ranking.subtitle">Popular universities by study quality and opportunities (2026)</p>
      </div>
      
      <div id="rankingList">
        <div class="inline-loading-note" role="status" aria-live="polite" data-i18n="ranking.loading">
          Loading rankings
        </div>
      </div>
    </div>
  </main>

  <script src="env.js"></script>
  <script src="config.js"></script>
  <script type="module" src="javascript/main.js"></script>

  <footer class="site-footer">
    <div class="container footer-content">
      <p data-i18n="footer.copyright">&copy; 2026 UniSearch</p>
      <div class="social-links">
        <a href="https://github.com/muxlex/unisearch" target="_blank">
          <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub" width="32">
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
