<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="./" />
  <link rel="icon" href="images/minilogo.png" type="image/png">
  <title data-i18n="title.ranking">Global Ranking | UniSearch</title>
  <script>
    (() => {
      const target = new URL("universities.html", window.location.href);
      const current = new URL(window.location.href);
      current.searchParams.forEach((value, key) => {
        if (key !== "tab") target.searchParams.set(key, value);
      });
      target.searchParams.set("tab", "ranking");
      window.location.replace(target.toString());
    })();
  </script>
  <script src="javascript/theme-init.js"></script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/universities.css" />
  <link rel="stylesheet" href="css/ranking.css" />

</head>
<body data-page="ranking">
  <div id="siteInitialLoader" class="site-initial-loader">
    <div class="site-initial-loader__spinner"></div>
  </div>
  <main class="u-page">
    <div class="rank-container">
      <div class="rank-header">
        <h1><span class="rank-title-icon" data-heroicon="trophy" data-icon-size="24"></span> <span data-i18n="ranking.title">Global University Ranking</span></h1>
        <p data-i18n="ranking.subtitle">Popular universities by study quality and opportunities (2026)</p>
      </div>

      <div class="rank-tools" aria-label="Ranking filters" data-i18n-aria-label="ranking.tools_aria">
        <label class="rank-search">
          <span data-heroicon="magnifying-glass" data-icon-size="18"></span>
          <input id="rankingSearchInput" type="search" placeholder="Search ranking..." data-i18n-placeholder="ranking.search_placeholder">
        </label>
        <div class="rank-country-filter u-field">
          <label class="u-label" for="rankingCountrySelect">
            <span class="u-label-icon"><span data-heroicon="globe-alt" data-icon-size="16"></span><span data-i18n="ranking.country_filter">Country</span></span>
          </label>
          <select id="rankingCountrySelect" class="u-select">
            <option value="" data-i18n="ranking.country_all">Global</option>
          </select>
        </div>
      </div>
      <p class="rank-source-note" data-i18n="ranking.source_note">Ranks use official published sources where available; universities without a published global rank stay visible after ranked entries.</p>
      
      <div id="rankingList" class="ranking-list">
        <div class="inline-loading-note" role="status" aria-live="polite" data-i18n="ranking.loading">
          Loading rankings
        </div>
      </div>
    </div>
  </main>

  <script src="env.js"></script>
  <script src="config.js"></script>
  <script type="module" src="javascript/main.js"></script>

  <footer class="site-footer">
    <div class="container footer-content">
      <p data-i18n="footer.copyright">&copy; 2026 UniSearch</p>
      <div class="social-links">
        <a href="https://github.com/muxlex/unisearch" target="_blank" rel="noopener noreferrer">
          <span class="footer-social-label">GitHub</span>
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
