<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="./" />
  <link rel="icon" href="images/minilogo.png" type="image/png">
  <title data-i18n="title.ranking">Global Rankings | UniSearch</title>
  <script src="javascript/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin,latin-ext" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/universities.css" />
  <link rel="stylesheet" href="css/ranking.css" />
</head>
<body data-page="ranking">
  <main class="u-page">
    <div class="rank-container">
      <div class="rank-header">
        <h1><span class="rank-title-icon">🏆</span> <span data-i18n="ranking.title">Global University Rankings</span></h1>
        <p data-i18n="ranking.subtitle">Popular universities by study quality and opportunities (2025)</p>
      </div>
      
      <div id="rankingList">
        <div class="center-loading" role="status" aria-label="Loading rankings" data-i18n-aria-label="ranking.loading">
          <div class="center-loading-spinner" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="env.js"></script>
  <script src="config.js"></script>
  <script type="module" src="javascript/main.js"></script>

  <footer class="site-footer">
      <div class="container footer-content">
          <p data-i18n="footer.copyright">© 2026 UniSearch</p>
          
          <div class="social-links">
              <a href="https://github.com/muxlex/unisearch" target="_blank">
                  <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub" width="32">
              </a>
          </div>
      </div>
  </footer>
</body>
</html>
