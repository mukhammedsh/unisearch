<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universities | UniSearch</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/universities.css" />
</head>

<body data-page="universities">
  <main class="u-page">
    <div class="u-layout">
      <aside class="u-sidebar">

        <div class="u-filter-card">
          <div class="u-filter-title">
            <span class="u-filter-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 5h18M6 12h12M10 19h4"
                      stroke="currentColor" stroke-width="2"
                      stroke-linecap="round"/>
              </svg>
            </span>
            <span>Filter</span>
            <button id="resetFiltersBtn" class="u-reset" type="button">
              Reset
            </button>
          </div>

          <div class="u-field">
            <label class="u-label" for="countrySelect">Country</label>
            <select id="countrySelect" class="u-select">
              <option value="">All countries</option>
            </select>
          </div>

          <div class="u-field" id="stateDiv" style="display: none;">
            <label class="u-label" for="stateSelect">State / Region</label>
            <select id="stateSelect" class="u-select">
              <option value="">Any State</option>
            </select>
          </div>

          <div class="u-field">
            <label class="u-label" for="citySelect">City</label>
            <select id="citySelect" class="u-select" disabled>
              <option value="">Select country first</option>
            </select>
          </div>

          <div class="u-field">
            <label class="u-label" for="majorSelect">Major</label>
            <select id="majorSelect" class="u-select">
              <option value="">Any major</option>
            </select>
          </div>

          <div class="u-field">
            <label class="u-label" for="studyLevelSelect">Study level</label>
            <select id="studyLevelSelect" class="u-select">
              <option value="">Any</option>
              <option value="Bachelor">Bachelor</option>
              <option value="Master">Master</option>
              <option value="PhD">PhD</option>
            </select>
          </div>

          <div class="u-field">
            <label class="u-label" for="formatSelect">Format</label>
            <select id="formatSelect" class="u-select">
              <option value="">Any</option>
              <option value="On-campus">On-campus</option>
              <option value="Online">Online</option>
              <option value="Hybrid">Hybrid</option>
            </select>
          </div>

          <div class="u-sep"></div>

          <div class="u-field">
            <label class="u-label">Tuition per year (USD)</label>
            <div class="u-two">
              <input id="minTuitionInput" class="u-input" type="number" min="0" placeholder="min" />
              <input id="maxTuitionInput" class="u-input" type="number" min="0" placeholder="max" />
            </div>
          </div>

          <div class="u-field">
            <label class="u-label" for="sortSelect">Sort Strategy</label>
            <select id="sortSelect" class="u-select">
              <option value="uni_ai">✨ UniFit: AI Smart Sort</option>
              <option value="name_asc">Name A-Z</option>
              <option value="tuition_asc">Cost low to high</option>
              <option value="tuition_desc">Cost high to low</option>
            </select>
          </div>

          <div class="u-field" id="aiSliderContainer">
            <label class="u-label" style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>Budget 💰</span>
                <span>Prestige 🏆</span>
            </label>
            <input type="range" id="uniFitSlider" min="0" max="100" value="50" style="width:100%; cursor:pointer; accent-color: #5d17ea;">
            <div style="font-size: 11px; color: #666; text-align: center; margin-top: 6px; font-weight:600;">
                <span id="sliderLabel">Balanced Strategy (50/50)</span>
            </div>
          </div>

        </div>
      </aside>

      <section class="u-content">
        <div class="u-top">
          <div class="u-search">
            <span class="u-search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"
                      stroke="currentColor" stroke-width="2"/>
                <path d="M16.5 16.5 21 21"
                      stroke="currentColor" stroke-width="2"
                      stroke-linecap="round"/>
              </svg>
            </span>
            <input id="qInput" type="text" placeholder="University or major" />
          </div>

          <div class="u-found">
            Found <span id="totalCount">0</span> universities
          </div>
        </div>

        <div id="listState" class="u-state"></div>
        <div id="universitiesList" class="u-grid"></div>
        <div id="pagination" class="u-pagination"></div>
      </section>
    </div>
  </main>

  <script src="javascript/utils.js"></script>      <script src="javascript/components.js"></script> <script src="javascript/algo.js"></script>       <script src="javascript/pages.js"></script>      <script src="javascript/main.js"></script>
</body>
</html>
