<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="./" />
  <link rel="icon" href="images/minilogo.svg" type="image/svg+xml">
  <title data-i18n="title.404">Page Not Found | UniSearch</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#5D17EB" />
  <script src="javascript/theme-init.js"></script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/error.css" />

</head>
<body data-page="error-404">
  <div id="siteInitialLoader" class="site-initial-loader">
    <div class="site-initial-loader__spinner"></div>
  </div>
  <main class="error-page error-page--404" id="mainContent">
    <div class="error-shell">
      <h1 class="error-title">
        <span class="error-kicker" data-i18n="error404.kicker">Error</span>
        <span class="error-code">404</span>
      </h1>
      <p class="error-desc" data-i18n="error404.title">This page does not exist</p>
      <div class="error-actions">
        <a href="index.html" data-route="home" class="error-btn error-btn--primary" data-i18n="error404.primary">Back to home</a>
      </div>
    </div>
  </main>

  <script src="env.js"></script>
  <script src="config.js"></script>
  <script type="module" src="javascript/main.js"></script>

  <footer class="site-footer">
    <div class="container footer-content">
      <div class="footer-meta">
        <p class="footer-copy" data-i18n="footer.copyright">&copy; 2026 UniSearch</p>
        <span class="footer-divider" aria-hidden="true">&bull;</span>
        <nav class="footer-legal-links" aria-label="Legal navigation" data-i18n-aria-label="footer.legal_nav_aria">
          <a href="privacy.html" data-route="privacy" data-i18n="footer.privacy">Privacy Policy</a>
          <span class="footer-divider" aria-hidden="true">&bull;</span>
          <a href="terms.html" data-route="terms" data-i18n="footer.terms">Terms of Use</a>
        </nav>
      </div>

      <div class="social-links">
        <a href="https://github.com/mukhammedsh/unisearch" target="_blank" rel="noopener noreferrer">
          <span class="footer-social-label">GitHub</span>
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
