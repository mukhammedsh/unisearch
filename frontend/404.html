<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="./" />
  <link rel="icon" href="images/minilogo.png" type="image/png">
  <title data-i18n="title.404">Page Not Found | UniSearch</title>
  <script src="javascript/theme-init.js"></script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/error.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin,latin-ext" rel="stylesheet">
</head>
<body data-page="error-404">
  <main class="error-page error-page--404">
    <section class="error-shell">
      <section class="error-main">
        <p class="error-kicker" data-i18n="error404.kicker">Error 404</p>
        <h1 class="error-title" data-i18n="error404.title">Page not found</h1>
        <p class="error-lead" data-i18n="error404.lead">
          The page may have moved, the link may be outdated, or the address may contain a typo.
        </p>

        <div class="error-actions">
          <a href="index.html" data-route="home" class="error-btn error-btn--primary" data-i18n="error404.primary">Go home</a>
          <a href="universities.html" data-route="universities" class="error-btn error-btn--secondary" data-i18n="error404.secondary">Open universities</a>
        </div>
      </section>
    </section>
  </main>

  <script src="env.js"></script>
  <script src="config.js"></script>
  <script type="module" src="javascript/main.js"></script>

  <footer class="site-footer">
    <div class="container footer-content">
      <p data-i18n="footer.copyright">&copy; 2026 UniSearch</p>
      <div class="social-links">
        <a href="https://github.com/muxlex/unisearch" target="_blank" rel="noopener">
          <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub" width="32">
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
