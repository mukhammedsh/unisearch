services:
  redis:
    image: redis:7-alpine
    container_name: unisearch-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: unisearch-backend
    restart: unless-stopped
    environment:
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      REDIS_URL: redis://redis:6379/0
      AUTO_WARMUP_ON_STARTUP: "1"
      METRICS_ENABLED: ${METRICS_ENABLED:-0}
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-}
      REQUEST_BODY_MAX_BYTES: ${REQUEST_BODY_MAX_BYTES:-131072}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      GLOBAL_RATE_LIMIT_REQUESTS: ${GLOBAL_RATE_LIMIT_REQUESTS:-600}
      GLOBAL_RATE_LIMIT_WINDOW_SEC: ${GLOBAL_RATE_LIMIT_WINDOW_SEC:-60}
      EXPENSIVE_RATE_LIMIT_REQUESTS: ${EXPENSIVE_RATE_LIMIT_REQUESTS:-120}
      EXPENSIVE_RATE_LIMIT_WINDOW_SEC: ${EXPENSIVE_RATE_LIMIT_WINDOW_SEC:-60}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000}"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.getenv('BACKEND_PORT', '8000'), timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:

