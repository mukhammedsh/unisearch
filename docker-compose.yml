services:
  redis:
    image: redis:7-alpine
    container_name: unisearch-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: unisearch-backend
    environment:
      FRONTEND_ORIGIN: http://127.0.0.1:5501
      APP_VERSION: 2.5.0
      REDIS_URL: redis://redis:6379/0
      AUTO_WARMUP_ON_STARTUP: "1"
      METRICS_ENABLED: "1"
    ports:
      - "8000:8000"
    depends_on:
      - redis

volumes:
  redis_data:
