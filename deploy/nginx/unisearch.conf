# UniSearch Production Nginx Reverse Proxy Configuration
# Basic per-IP request and connection limits, timeouts, and static asset caching; not full DDoS protection.

# Zone for limiting concurrent TCP connections from one IP.
limit_conn_zone $binary_remote_addr zone=unisearch_conn_limit:10m;

# Zone for Nginx request-rate limiting.
limit_req_zone $binary_remote_addr zone=unisearch_req_limit:10m rate=30r/s;

upstream unisearch_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Timeouts for slow headers and request bodies.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    keepalive_requests 100;

    # Nginx request-body limit; FastAPI applies its own REQUEST_BODY_MAX_BYTES limit.
    client_max_body_size 256k;
    client_body_buffer_size 128k;

    # Limit concurrent connections from one IP.
    limit_conn unisearch_conn_limit 25;

    # Gzip compression to reduce response size.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # Trusted Cloudflare IPv4 ranges only (uncomment when using a custom domain with Cloudflare).
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # real_ip_header CF-Connecting-IP;

    # Cache static university assets (logos and photos).
    location /universities/assets/ {
        proxy_pass http://unisearch_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Main proxy to the FastAPI backend.
    location / {
        # Apply request-rate limiting with a small burst allowance.
        limit_req zone=unisearch_req_limit burst=20 nodelay;

        proxy_pass http://unisearch_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;

        # Buffer upstream responses for slow clients.
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }
}
