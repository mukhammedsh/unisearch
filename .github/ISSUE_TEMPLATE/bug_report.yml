name: Bug report
description: Report a reproducible UniSearch bug.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible behavior and the page or API endpoint affected.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Keep this short and concrete.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend UI
        - Backend API
        - University data
        - Localization
        - CI or release workflow
        - Documentation
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or runtime
      placeholder: "Chrome 124, Safari, Python 3.12, Node 20..."
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or notes
      description: Do not paste secrets, tokens, cookies, personal IPs, or .env values.
