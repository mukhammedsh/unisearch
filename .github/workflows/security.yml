name: Security Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install node dependencies
        run: npm ci

      - name: Audit node dependencies
        run: npm audit --audit-level=moderate

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Audit Python dependencies
        id: python_audit
        continue-on-error: true
        run: python -m pip_audit -r backend/requirements-dev.txt

      - name: Warn about Python audit findings
        if: steps.python_audit.outcome == 'failure'
        run: |
          echo "::warning::pip-audit reported vulnerable Python dependencies. Review the audit output before publishing a release. The step is currently non-blocking because ML transitive dependencies may require a coordinated upgrade."

  repository-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Block accidental secret files
        shell: bash
        run: |
          blocked=0
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$file" in
              *.env.example|*.env.sample|*.env.template|*.example.env)
                continue
                ;;
            esac
            case "$name" in
              .env|.env.*|*.pem|*.key|*.p12|*.pfx|id_rsa|id_ed25519)
                echo "::error file=$file::Secret-like file is tracked. Keep real credentials outside Git and document placeholders in .env.example files."
                blocked=1
                ;;
            esac
          done < <(git ls-files -z)
          exit "$blocked"

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile .
