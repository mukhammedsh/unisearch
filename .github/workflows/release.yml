name: Release Artifacts And Container

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare variables
        id: vars
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Validate release changelog
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vX.Y.Z format, got '$TAG'."
            exit 1
          fi

          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## {re.escape(version)}(?:\s|\()", re.MULTILINE)
          match = heading.search(changelog)
          if not match:
              print(f"::error::CHANGELOG.md has no section for {version}.")
              sys.exit(1)

          next_heading = re.search(r"^## \d+\.\d+\.\d+(?:\s|\()", changelog[match.end():], re.MULTILINE)
          end = match.end() + next_heading.start() if next_heading else len(changelog)
          section = changelog[match.start():end]
          bullets = [line[2:].strip() for line in section.splitlines() if line.startswith("- ")]
          if not bullets:
              print(f"::error::CHANGELOG.md section {version} has no release notes.")
              sys.exit(1)

          housekeeping_patterns = [
              r"^synchronized runtime/package version\b",
              r"^bumped\b.*\bversion\b",
              r"^documented\b.*\b(AGENTS\.md|CLAUDE\.md|release|workflow|agent)\b",
              r"^added\b.*\b(test|tests|coverage)\b",
              r"^updated\b.*\b(test|tests|coverage)\b",
              r"^verified\b",
              r"^performed a full project hygiene check\b",
              r"^cleaned\b.*\b(temporary|transient)\b",
          ]
          housekeeping = re.compile("|".join(f"(?:{pattern})" for pattern in housekeeping_patterns), re.IGNORECASE)
          user_visible = [bullet for bullet in bullets if not housekeeping.search(bullet)]
          if not user_visible:
              print(
                  "::error::CHANGELOG.md section "
                  f"{version} has only release housekeeping. Add a user-facing behavior/API/data/UI change before publishing."
              )
              sys.exit(1)

          print(f"Release {version} changelog has {len(user_visible)} user-facing note(s).")
          PY

      - name: Build zip artifacts for release
        shell: bash
        run: |
          mkdir -p release
          git archive \
            --format=zip \
            --prefix="unisearch-${{ steps.vars.outputs.tag }}/" \
            --output="release/unisearch-full-${{ steps.vars.outputs.tag }}.zip" \
            HEAD
          git archive \
            --format=zip \
            --output="release/unisearch-frontend-${{ steps.vars.outputs.tag }}.zip" \
            HEAD \
            frontend
          git archive \
            --format=zip \
            --output="release/unisearch-backend-${{ steps.vars.outputs.tag }}.zip" \
            HEAD \
            backend/app \
            backend/data \
            backend/requirements.txt \
            backend/requirements-dev.txt \
            backend/.env.example \
            package.json

      - name: Upload zip artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/unisearch-full-${{ steps.vars.outputs.tag }}.zip
            release/unisearch-frontend-${{ steps.vars.outputs.tag }}.zip
            release/unisearch-backend-${{ steps.vars.outputs.tag }}.zip

      - name: Update release download guide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gh release view "$TAG" --json body -q .body > release/release-body-current.md

          python - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          start = "<!-- UNISEARCH_DOWNLOAD_GUIDE_START -->"
          end = "<!-- UNISEARCH_DOWNLOAD_GUIDE_END -->"
          guide = f"""## Download guide

          - **Local development / full project:** download `unisearch-full-{tag}.zip` (recommended) or GitHub's auto-generated `Source code (zip)`.
          - **Static frontend deploy:** download `unisearch-frontend-{tag}.zip`; configure `frontend/env.js` for your backend URL.
          - **Backend deploy:** download `unisearch-backend-{tag}.zip`; it includes the FastAPI app, data, requirements, `.env.example`, and `package.json` for runtime version metadata.
          - GitHub also shows auto-generated `Source code (zip)` and `Source code (tar.gz)` for every release. They are expected and cannot be removed.
          """

          body_path = Path("release/release-body-current.md")
          body = body_path.read_text(encoding="utf-8").rstrip()
          block = f"{start}\n{guide.strip()}\n{end}"

          if start in body and end in body:
              prefix = body.split(start, 1)[0].rstrip()
              suffix = body.split(end, 1)[1].lstrip()
              next_body = "\n\n".join(part for part in [prefix, block, suffix] if part)
          else:
              next_body = "\n\n".join(part for part in [body, block] if part)

          Path("release/release-body-next.md").write_text(next_body + "\n", encoding="utf-8")
          PY

          gh release edit "$TAG" --notes-file release/release-body-next.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/unisearch-backend:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/unisearch-backend:${{ steps.vars.outputs.version }}
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/unisearch-backend:latest
