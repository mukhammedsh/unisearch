name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      OPS_ADMIN_TOKEN: test-ops-token
      RATE_LIMIT_ENABLED: "0"
      ML_SEMANTIC_EMBEDDINGS_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install backend dependencies
        run: |
          uv pip install --system --require-hashes --only-binary=:all: -r backend/requirements-dev.lock

      - name: Run backend tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m coverage run --branch -m unittest discover tests -v 2>&1 | tee ../backend-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failure_output="$(python -c 'from pathlib import Path; text = Path("../backend-test.log").read_text(encoding="utf-8", errors="replace"); markers = ["\n======================================================================\nFAIL:", "\n======================================================================\nERROR:", "\nFAILED ("]; positions = [text.find(marker) for marker in markers if text.find(marker) >= 0]; snippet = text[min(positions):] if positions else text[-2500:]; print(snippet[-2500:])')"
            {
              echo "### Backend unittest failure"
              echo '```text'
              printf '%s\n' "$failure_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            failure_output="${failure_output//'%'/'%25'}"
            failure_output="${failure_output//$'\n'/'%0A'}"
            failure_output="${failure_output//$'\r'/'%0D'}"
            echo "::error title=Backend unittest failure::$failure_output"
            exit "$status"
          fi
          python -m coverage xml -o coverage.xml

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  e2e-pr:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: "uv pip install --system --require-hashes --only-binary=:all: -r backend/requirements.lock"

      - name: Install node dependencies
        run: npm ci --ignore-scripts

      - name: Run i18n consistency checks
        run: npm run check:i18n

      - name: Run frontend unit tests
        run: npm run test:unit:coverage

      - name: Install Playwright browser (Chromium)
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run E2E PR suite
        env:
          CODECOV_BROWSER_COVERAGE_DIR: coverage/frontend/tmp
        run: npm run test:e2e:pr

      - name: Merge browser coverage into frontend report
        run: |
          test -n "$(find coverage/frontend/tmp -maxdepth 1 -name 'browser-*.json' -print -quit)"
          ./node_modules/.bin/c8 report --all --src=frontend/javascript --include="frontend/javascript/**/*.js" --reporter=lcov --reporter=text --reports-dir=coverage/frontend --temp-directory=coverage/frontend/tmp

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/frontend/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-pr
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  nightly-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: "uv pip install --system --require-hashes --only-binary=:all: -r backend/requirements.lock"

      - name: Install node dependencies
        run: npm ci --ignore-scripts

      - name: Run i18n consistency checks
        run: npm run check:i18n

      - name: Install Playwright browsers (all nightly targets)
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Run full nightly E2E matrix
        run: npm run test:e2e:nightly

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-nightly
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
