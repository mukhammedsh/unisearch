name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backend-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      OPS_ADMIN_TOKEN: test-ops-token
      RATE_LIMIT_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m unittest discover tests -v 2>&1 | tee ../backend-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Backend unittest failure tail"
              echo '```text'
              tail -n 120 ../backend-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail_output="$(tail -n 80 ../backend-test.log)"
            tail_output="${tail_output//'%'/'%25'}"
            tail_output="${tail_output//$'\n'/'%0A'}"
            tail_output="${tail_output//$'\r'/'%0D'}"
            echo "::error title=Backend unittest failure::$tail_output"
            exit "$status"
          fi

  e2e-pr:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install node dependencies
        run: npm install

      - name: Run i18n consistency checks
        run: npm run check:i18n

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E PR suite
        run: npm run test:e2e:pr

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  nightly-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install node dependencies
        run: npm install

      - name: Run i18n consistency checks
        run: npm run check:i18n

      - name: Install Playwright browsers (all nightly targets)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run full nightly E2E matrix
        run: npm run test:e2e:nightly

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
